            { day: 'Thu', period: 1, subject: '第Ⅰ類実験Ⅱ', teacher: '-', room: '-', category: 'REQUIRED' },
            { day: 'Thu', period: 2, subject: '電子回路', teacher: '柏葉', room: '8-206', category: 'REQUIRED' },
            { day: 'Thu', period: 3, subject: 'ICTシステム開発演習', teacher: '安藤、岡本、奥村、藤原', room: '8-401', category: 'REQUIRED' },
            { day: 'Thu', period: 4, subject: 'IoT・エッジコンピューティング', teacher: '千葉、力武', room: '8-401', category: 'ELECTIVE' },
            { day: 'Thu', period: 5, subject: 'なし', teacher: '-', room: '-', category: 'OTHER' },

            // 金曜日
            { day: 'Fri', period: 1, subject: '化学特論', teacher: '小松', room: '2-102', category: 'ELECTIVE' },
            { day: 'Fri', period: 2, subject: '第Ⅰ類実験Ⅱ', teacher: '-', room: '-', category: 'REQUIRED' },
            { day: 'Fri', period: 3, subject: '電気電子計測', teacher: '林(忠)', room: '2-102', category: 'REQUIRED' },
            { day: 'Fri', period: 4, subject: 'ネットワークプログラミング', teacher: '小林(秀)', room: '8-401', category: 'ELECTIVE' },
            { day: 'Fri', period: 5, subject: 'なし', teacher: '-', room: '-', category: 'OTHER' },
        ];

        // アプリケーション状態管理
        let currentSimulatedTime = null;
        let activeSelectedSubject = null;

        // LocalStorage キー
        const STORAGE_KEY_MEMO = 'nit_4it_timetable_memos_v1';
        const STORAGE_KEY_TODO = 'nit_4it_timetable_todos_v1';

        function loadStoredData(key) {
            try {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : {};
            } catch (e) {
                console.error('Storage load error:', e);
                return {};
            }
        }

        function saveStoredData(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify(data));
            } catch (e) {
                console.error('Storage save error:', e);
            }
        }

        let subjectMemos = loadStoredData(STORAGE_KEY_MEMO);
        let subjectTodos = loadStoredData(STORAGE_KEY_TODO);

        function getDueDateBadge(dueDateStr, completed) {
            if (!dueDateStr) return '';
            if (completed) return `<span class="text-[9px] text-slate-400 bg-slate-100 px-1 rounded">完了</span>`;

            const now = currentSimulatedTime ? new Date(currentSimulatedTime) : new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            const [y, m, d] = dueDateStr.split('-').map(Number);
            const targetDate = new Date(y, m - 1, d);

            const diffDays = Math.ceil((targetDate - today) / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return `<span class="text-[9px] font-bold text-rose-700 bg-rose-100 px-1 rounded">${Math.abs(diffDays)}日超過</span>`;
            } else if (diffDays === 0) {
                return `<span class="text-[9px] font-bold text-amber-800 bg-amber-100 px-1 rounded">今日まで</span>`;
            } else {
                return `<span class="text-[9px] text-blue-700 bg-blue-50 px-1 rounded">あと${diffDays}日</span>`;
            }
        }

        // 時間割の初期化とレンダリング
        function renderTimetable() {
            const bodyContainer = document.getElementById('timetable-body');
            bodyContainer.innerHTML = '';

            const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
            const categoryFilter = document.getElementById('category-filter').value;

            PERIODS.forEach(period => {
                // 左端の時限ラベルセル
                const periodLabelCell = document.createElement('div');
                periodLabelCell.className = 'bg-slate-50 p-1 flex flex-col justify-center items-center border-t border-slate-200 text-center select-none';
                periodLabelCell.innerHTML = `
                    <span class="font-extrabold text-slate-800 text-xs sm:text-sm">${period.id}限</span>
                `;
                bodyContainer.appendChild(periodLabelCell);

                // 各曜日のセル
                DAYS.forEach(day => {
                    const item = timetableData.find(d => d.day === day.code && d.period === period.id);
                    const cell = document.createElement('div');
                    
                    cell.className = `p-1 relative transition-all duration-200 flex flex-col`;
                    cell.dataset.day = day.code;
                    cell.dataset.period = period.id;

                    if (!item || item.subject === 'なし') {
                        // 空きコマ表示
                        cell.innerHTML = `
                            <div class="h-full min-h-[50px] sm:min-h-[58px] rounded-lg border border-dashed border-slate-200 bg-slate-50/50 p-1 flex flex-col items-center justify-center text-slate-300">
                                <span class="text-[10px]">空き</span>
                            </div>
                        `;
                    } else {
                        const matchesSearch = !searchTerm || 
                            item.subject.toLowerCase().includes(searchTerm) || 
                            item.teacher.toLowerCase().includes(searchTerm) || 
                            item.room.toLowerCase().includes(searchTerm);
                        
                        const matchesCategory = (categoryFilter === 'all' || item.category === categoryFilter);

                        const isMatch = matchesSearch && matchesCategory;
                        const catInfo = CATEGORIES[item.category] || CATEGORIES.OTHER;

                        const subjectKey = `${item.day}_${item.period}`;
                        const todos = subjectTodos[subjectKey] || [];

                        cell.innerHTML = `
                            <div class="subject-card h-full min-h-[50px] sm:min-h-[58px] rounded-lg border ${catInfo.border} ${catInfo.lightBg} p-1.5 flex flex-col justify-between cursor-pointer hover:shadow-xs transition-all duration-150 ${!isMatch ? 'opacity-25 grayscale-[50%]' : ''}"
                                 onclick="openSubjectModal('${item.day}', ${item.period})">
                                
                                <div>
                                    <!-- 科目名 -->
                                    <h4 class="font-extrabold text-slate-900 text-[11px] sm:text-xs leading-tight line-clamp-2">
                                        ${item.subject}
                                    </h4>
                                </div>

                                <!-- 担当教員・教室名 -->
                                <div class="flex items-center justify-between text-[9px] sm:text-[10px] text-slate-500 font-medium pt-1 mt-1 border-t border-slate-200/50 leading-none">
                                    <span class="truncate max-w-[50px] sm:max-w-[70px]">${item.teacher}</span>
                                    <span class="truncate text-slate-600 font-semibold bg-white/80 px-1 py-0.5 rounded">${item.room}</span>
                                </div>
                            </div>
                        `;
                    }

                    bodyContainer.appendChild(cell);
                });
            });

            updateCurrentTimeHighlight();
            updateTodoBadgeCount();
        }

        function updateCurrentTimeHighlight() {
            const now = currentSimulatedTime ? new Date(currentSimulatedTime) : new Date();

            const timeStr = now.toTimeString().split(' ')[0].substring(0, 5);
            const daysStr = ['日', '月', '火', '水', '木', '金', '土'];
            document.getElementById('current-time-display').innerText = `${daysStr[now.getDay()]} ${timeStr}`;

            const isHighlightEnabled = document.getElementById('toggle-highlight').checked;
            
            document.querySelectorAll('.timetable-grid [data-day]').forEach(el => {
                const card = el.querySelector('.subject-card');
                if (card) {
                    card.classList.remove('ring-2', 'ring-blue-500', 'z-10');
                }
            });

            const banner = document.getElementById('current-subject-banner');

            if (!isHighlightEnabled) {
                banner.classList.add('hidden');
                return;
            }

            const dayOfWeek = now.getDay();
            const dayCodes = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const currentDayCode = dayCodes[dayOfWeek];

            if (dayOfWeek === 0 || dayOfWeek === 6) {
                banner.classList.add('hidden');
                return;
            }

            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            let activePeriod = null;
            PERIODS.forEach(p => {
                const [sH, sM] = p.start.split(':').map(Number);
                const [eH, eM] = p.end.split(':').map(Number);
                if (currentMinutes >= (sH * 60 + sM) && currentMinutes <= (eH * 60 + eM)) {
                    activePeriod = p.id;
                }
            });

            if (activePeriod) {
                const activeCell = document.querySelector(`[data-day="${currentDayCode}"][data-period="${activePeriod}"]`);
                const activeData = timetableData.find(d => d.day === currentDayCode && d.period === activePeriod);

                if (activeData && activeData.subject !== 'なし') {
                    if (activeCell) {
                        const card = activeCell.querySelector('.subject-card');
                        if (card) {
                            card.classList.add('ring-2', 'ring-blue-500', 'z-10');
                        }
                    }

                    banner.classList.remove('hidden');
                    document.getElementById('current-banner-text').innerText = 
                        `現在 [${activePeriod}限] ${activeData.subject} (${activeData.room})`;
                    
                    document.getElementById('banner-focus-btn').onclick = () => {
                        if (activeCell) activeCell.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    };
                } else {
                    banner.classList.add('hidden');
                }
            } else {
                banner.classList.add('hidden');
            }
        }

        function openSubjectModal(dayCode, periodId) {
            const item = timetableData.find(d => d.day === dayCode && d.period === periodId);
            if (!item || item.subject === 'なし') return;

            activeSelectedSubject = { day: dayCode, period: periodId, ...item };
            const subjectKey = `${dayCode}_${periodId}`;
            const catInfo = CATEGORIES[item.category] || CATEGORIES.OTHER;

            document.getElementById('modal-title').innerText = item.subject;
            document.getElementById('modal-teacher').innerText = item.teacher;
            document.getElementById('modal-room').innerText = item.room;

            const dayObj = DAYS.find(d => d.code === dayCode);
            const periodObj = PERIODS.find(p => p.id === periodId);
            document.getElementById('modal-period-badge').innerText = `${dayObj.name} ${periodObj.name} (${periodObj.start}-${periodObj.end})`;
            
            document.getElementById('modal-category-badge').innerText = catInfo.name;
            document.getElementById('modal-memo').value = subjectMemos[subjectKey] || '';
            document.getElementById('modal-todo-date').value = '';
            renderModalTodoList(subjectKey);

            const modal = document.getElementById('subject-modal');
            const container = modal.querySelector('.modal-container');
            modal.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeSubjectModal() {
            const modal = document.getElementById('subject-modal');
            const container = modal.querySelector('.modal-container');
            container.classList.remove('scale-100', 'opacity-100');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 150);
        }

        function renderModalTodoList(subjectKey) {
            const listEl = document.getElementById('modal-todo-list');
            listEl.innerHTML = '';

            const todos = subjectTodos[subjectKey] || [];

            if (todos.length === 0) {
                listEl.innerHTML = `<li class="text-[11px] text-slate-400 italic">課題はありません</li>`;
                return;
            }

            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between bg-slate-50 border border-slate-200 rounded-md p-2 text-xs gap-2';
                
                const dateBadgeHtml = getDueDateBadge(todo.dueDate, todo.completed);

                li.innerHTML = `
                    <label class="flex items-center gap-2 cursor-pointer flex-1 min-w-0">
                        <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodoState('${subjectKey}', ${index})" class="rounded text-blue-600 focus:ring-blue-500 shrink-0">
                        <span class="${todo.completed ? 'line-through text-slate-400' : 'text-slate-800'} truncate text-xs">${escapeHtml(todo.text)}</span>
                    </label>
                    <div class="flex items-center gap-1.5 shrink-0">
                        ${dateBadgeHtml}
                        <button onclick="deleteTodo('${subjectKey}', ${index})" class="text-slate-400 hover:text-rose-500 px-1">
                            <i class="fa-solid fa-trash text-[10px]"></i>
                        </button>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }

        function toggleTodoState(subjectKey, index) {
            if (subjectTodos[subjectKey] && subjectTodos[subjectKey][index]) {
                subjectTodos[subjectKey][index].completed = !subjectTodos[subjectKey][index].completed;
                saveStoredData(STORAGE_KEY_TODO, subjectTodos);
                renderModalTodoList(subjectKey);
                renderTimetable();
            }
        }

        function toggleTodoStateFromSummary(subjectKey, index) {
            if (subjectTodos[subjectKey] && subjectTodos[subjectKey][index]) {
                subjectTodos[subjectKey][index].completed = !subjectTodos[subjectKey][index].completed;
                saveStoredData(STORAGE_KEY_TODO, subjectTodos);
                openTodoSummaryModal();
                renderTimetable();
            }
        }

        function deleteTodo(subjectKey, index) {
            if (subjectTodos[subjectKey]) {
                subjectTodos[subjectKey].splice(index, 1);
                saveStoredData(STORAGE_KEY_TODO, subjectTodos);
                renderModalTodoList(subjectKey);
                renderTimetable();
            }
        }

        function deleteTodoFromSummary(subjectKey, index) {
            if (subjectTodos[subjectKey]) {
                subjectTodos[subjectKey].splice(index, 1);
                saveStoredData(STORAGE_KEY_TODO, subjectTodos);
                openTodoSummaryModal();
                renderTimetable();
            }
        }

        function deleteMemoFromSummary(subjectKey) {
            if (subjectMemos[subjectKey]) {
                delete subjectMemos[subjectKey];
                saveStoredData(STORAGE_KEY_MEMO, subjectMemos);
                openTodoSummaryModal();
                renderTimetable();
            }
        }

        function addTodoItem() {
            if (!activeSelectedSubject) return;
            const input = document.getElementById('modal-todo-input');
            const dateInput = document.getElementById('modal-todo-date');
            const text = input.value.trim();
            const dueDate = dateInput.value;
            if (!text) return;

            const subjectKey = `${activeSelectedSubject.day}_${activeSelectedSubject.period}`;
            if (!subjectTodos[subjectKey]) {
                subjectTodos[subjectKey] = [];
            }

            subjectTodos[subjectKey].push({
                text: text,
                dueDate: dueDate || '',
                completed: false,
                createdAt: new Date().toISOString()
            });
            saveStoredData(STORAGE_KEY_TODO, subjectTodos);
            input.value = '';
            dateInput.value = '';
            renderModalTodoList(subjectKey);
            renderTimetable();
        }

        function updateTodoBadgeCount() {
            let totalUncompleted = 0;
            Object.values(subjectTodos).forEach(list => {
                totalUncompleted += list.filter(t => !t.completed).length;
            });

            const badge = document.getElementById('todo-badge');
            if (totalUncompleted > 0) {
                badge.innerText = totalUncompleted;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function openTodoSummaryModal() {
            const body = document.getElementById('todo-summary-body');
            body.innerHTML = '';

            let hasItems = false;
            const aggregatedItems = [];

            timetableData.forEach(item => {
                if (item.subject === 'なし') return;
                const subjectKey = `${item.day}_${item.period}`;
                const todos = subjectTodos[subjectKey] || [];
                const memo = subjectMemos[subjectKey] || '';

                if (todos.length > 0 || memo.trim()) {
                    hasItems = true;
                    const dayObj = DAYS.find(d => d.code === item.day);
                    const sortedTodos = todos.map((t, origIdx) => ({ ...t, origIdx }));
                    
                    sortedTodos.sort((a, b) => {
                        if (a.completed !== b.completed) return a.completed ? 1 : -1;
                        if (!a.dueDate) return 1;
                        if (!b.dueDate) return -1;
                        return a.dueDate.localeCompare(b.dueDate);
                    });

                    aggregatedItems.push({ item, subjectKey, dayObj, todos: sortedTodos, memo });
                }
            });

            aggregatedItems.forEach(({ item, subjectKey, dayObj, todos, memo }) => {
                const section = document.createElement('div');
                section.className = 'bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs';
                
                let todosHtml = '';
                if (todos.length > 0) {
                    todosHtml = `
                        <div class="mt-2 space-y-1">
                            ${todos.map((t) => `
                                <div class="flex items-center justify-between bg-white p-2 rounded border border-slate-200">
                                    <label class="flex items-center gap-2 cursor-pointer min-w-0 flex-1">
                                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodoStateFromSummary('${subjectKey}',${t.origIdx})" class="rounded text-blue-600 focus:ring-blue-500 shrink-0">
                                        <span class="${t.completed ? 'line-through text-slate-400' : 'text-slate-800'} truncate text-xs">${escapeHtml(t.text)}</span>
                                    </label>
                                    <div class="flex items-center gap-1.5 shrink-0">
                                        ${getDueDateBadge(t.dueDate, t.completed)}
                                        <button onclick="deleteTodoFromSummary('${subjectKey}',${t.origIdx})" class="text-slate-400 hover:text-rose-500 px-1">
                                            <i class="fa-solid fa-trash text-[10px]"></i>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                let memoHtml = '';
                if (memo.trim()) {
                    memoHtml = `
                        <div class="mt-2 text-xs text-slate-700 bg-amber-50 p-2 rounded border border-amber-200 flex items-start justify-between gap-1.5">
                            <div><i class="fa-regular fa-note-sticky text-amber-600 mr-1.5"></i>${escapeHtml(memo)}</div>
                            <button onclick="deleteMemoFromSummary('${subjectKey}')" class="text-slate-400 hover:text-rose-500 shrink-0">
                                <i class="fa-solid fa-trash text-[10px]"></i>
                            </button>
                        </div>
                    `;
                }

                section.innerHTML = `
                    <div class="flex items-center justify-between border-b pb-1.5 border-slate-200">
                        <span class="font-bold text-slate-800 text-xs sm:text-sm">${item.subject}</span>
                        <span class="text-[11px] text-slate-500 font-medium">${dayObj.name} ${item.period}限</span>
                    </div>
                    ${todosHtml}
                    ${memoHtml}
                `;
                body.appendChild(section);
            });

            if (!hasItems) {
                body.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">現在保存されている課題やメモはありません。</div>`;
            }

            document.getElementById('todo-summary-modal').classList.remove('hidden');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTimetable();

            window.addEventListener('resize', renderTimetable);
            setInterval(updateCurrentTimeHighlight, 1000);

            document.getElementById('search-input').addEventListener('input', renderTimetable);
            document.getElementById('category-filter').addEventListener('change', renderTimetable);
            document.getElementById('toggle-highlight').addEventListener('change', updateCurrentTimeHighlight);

            document.getElementById('modal-close-btn').addEventListener('click', closeSubjectModal);
            document.getElementById('modal-save-btn').addEventListener('click', () => {
                if (activeSelectedSubject) {
                    const subjectKey = `${activeSelectedSubject.day}_${activeSelectedSubject.period}`;
                    subjectMemos[subjectKey] = document.getElementById('modal-memo').value;
                    saveStoredData(STORAGE_KEY_MEMO, subjectMemos);
                }
                closeSubjectModal();
                renderTimetable();
            });

            document.getElementById('modal-todo-add-btn').addEventListener('click', addTodoItem);
            document.getElementById('modal-todo-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTodoItem();
            });

            document.getElementById('todo-list-btn').addEventListener('click', openTodoSummaryModal);
            document.getElementById('todo-modal-close').addEventListener('click', () => {
                document.getElementById('todo-summary-modal').classList.add('hidden');
            });
            document.getElementById('todo-modal-close-btn').addEventListener('click', () => {
                document.getElementById('todo-summary-modal').classList.add('hidden');
            });

            document.getElementById('subject-modal').addEventListener('click', (e) => {
                if (e.target.id === 'subject-modal') closeSubjectModal();
            });

            const simBtn = document.getElementById('sim-btn');
            const simPanel = document.getElementById('sim-panel');
            simBtn.addEventListener('click', () => {
                simPanel.classList.toggle('hidden');
            });

            document.getElementById('sim-apply-btn').addEventListener('click', () => {
                const dayVal = parseInt(document.getElementById('sim-day').value);
                const timeVal = document.getElementById('sim-time').value;

                const [h, m] = timeVal.split(':').map(Number);
                
                const simDate = new Date();
                const currentDay = simDate.getDay();
                const distance = (dayVal - currentDay + 7) % 7;
                simDate.setDate(simDate.getDate() + distance);
                simDate.setHours(h, m, 0);

                currentSimulatedTime = simDate;
                updateCurrentTimeHighlight();
            });

            document.getElementById('sim-reset-btn').addEventListener('click', () => {
                currentSimulatedTime = null;
                updateCurrentTimeHighlight();
            });
        });
    </script>
</body>
</html>
