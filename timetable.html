<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#edf0f5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="時間割">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>仙台高専 令和8年度後期時間割 | IT4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

    <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>

    <style>
        /* ==================== デザイントークン ==================== */
        :root {
            --bg: #edf0f5;
            --surface: #ffffff;
            --ink: #121a29;
            --ink-2: #4a5568;
            --ink-3: #7b8798;
            --line: #d8dee8;

            --req: #2447a6;       /* 必修 */
            --req-tint: #e8eefc;
            --ele: #0a7667;       /* 選択 */
            --ele-tint: #e1f3ef;
            --oth: #5f6b7c;
            --oth-tint: #eef1f5;

            --on-solid: #ffffff;
            --today: rgba(36, 71, 166, .07);

            --danger: #c0352b;
            --danger-tint: #fde8e6;
            --warn: #9a5b00;
            --warn-tint: #fff1d6;
            --ok-tint: #e7edf6;

            --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
            --pw: 36px;           /* 時限列の幅 */
            --gap: 1px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e131b;
                --surface: #161d28;
                --ink: #e9eef6;
                --ink-2: #a9b4c4;
                --ink-3: #74829a;
                --line: #273140;

                --req: #86a5ff;
                --req-tint: #18233f;
                --ele: #47c9b3;
                --ele-tint: #112d2a;
                --oth: #8b97aa;
                --oth-tint: #1b2330;

                --on-solid: #0b1020;
                --today: rgba(134, 165, 255, .09);

                --danger: #ff8a80;
                --danger-tint: #3a1c1b;
                --warn: #f2b45a;
                --warn-tint: #33260f;
                --ok-tint: #202a38;
            }
        }

        @media (min-width: 640px) {
            :root { --pw: 76px; --gap: 2px; }
        }

        /* ==================== ベース ==================== */
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            min-height: 100dvh;
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.5;
            color: var(--ink);
            background-color: var(--bg);
            background-image: var(--bg-image, none);
            background-size: var(--bg-size, auto);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }
        button { font: inherit; color: inherit; }
        h1, h2, h3, p { margin: 0; }
        .hidden { display: none !important; }
        .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
        :focus-visible { outline: 2px solid var(--req); outline-offset: 2px; }

        .cat-REQUIRED { --c: var(--req); --t: var(--req-tint); }
        .cat-ELECTIVE { --c: var(--ele); --t: var(--ele-tint); }
        .cat-OTHER    { --c: var(--oth); --t: var(--oth-tint); }

        /* ==================== 上部バー ==================== */
        .bar {
            position: sticky; top: 0; z-index: 30;
            background: color-mix(in srgb, var(--bg) 90%, transparent);
            -webkit-backdrop-filter: saturate(1.4) blur(12px);
            backdrop-filter: saturate(1.4) blur(12px);
            border-bottom: 1px solid var(--line);
        }
        .bar-in { max-width: 1080px; margin: 0 auto; padding: 8px 12px; }
        .bar-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .bar-row + .bar-row { margin-top: 8px; }

        .brand h1 { font-size: 24px; font-weight: 900; line-height: 1.05; letter-spacing: .02em; }
        .brand p { margin-top: 2px; font-size: 11px; color: var(--ink-3); }
        .actions { display: flex; align-items: center; gap: 6px; }

        .chip, .tb {
            display: inline-flex; align-items: center; gap: 6px;
            height: 32px; padding: 0 10px;
            font-size: 12px; font-weight: 500;
            color: var(--ink-2);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            font-variant-numeric: tabular-nums;
        }
        .tb { position: relative; cursor: pointer; }
        .tb:hover { background-color: color-mix(in srgb, var(--surface) 85%, var(--ink) 6%); }
        .tb.strong { color: var(--ink); font-weight: 700; }
        .badge {
            position: absolute; top: -6px; right: -6px;
            min-width: 18px; height: 18px; padding: 0 4px;
            display: grid; place-items: center;
            font-size: 10px; font-weight: 800;
            color: #fff; background: #d6336c; border-radius: 9px;
        }

        .lbl { display: none; }
        @media (min-width: 640px) { .lbl { display: inline; } }

        /* 区分フィルター */
        .seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; }
        .seg button {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 11px; border: 0; border-radius: 7px;
            font-size: 12px; font-weight: 700; color: var(--ink-2);
            background: transparent; cursor: pointer;
        }
        .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
        .seg .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }

        /* トグル */
        .switch { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); cursor: pointer; user-select: none; }
        .track { position: relative; width: 32px; height: 19px; border-radius: 10px; background: var(--line); transition: background .15s; flex: none; }
        .track::after {
            content: ""; position: absolute; top: 2px; left: 2px;
            width: 15px; height: 15px; border-radius: 50%;
            background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .3);
            transition: transform .15s;
        }
        .sr:checked + .track { background: var(--ink); }
        .sr:checked + .track::after { transform: translateX(13px); }
        .sr:focus-visible + .track { outline: 2px solid var(--req); outline-offset: 2px; }

        /* 授業中バー */
        .now-bar { background: var(--ink); color: var(--bg); font-size: 12px; }
        .now-in { max-width: 1080px; margin: 0 auto; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .now-l { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .now-l .tag { flex: none; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 99px; background: var(--bg); color: var(--ink); }
        #current-banner-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #current-banner-text .muted { opacity: .7; margin-left: 6px; }
        .live { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #34d399; }
        @media (prefers-reduced-motion: no-preference) {
            .live { animation: pulse 1.8s ease-out infinite; }
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .6); }
            100% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
        }

        /* ==================== 時間割ボード ==================== */
        main { max-width: 1080px; margin: 0 auto; padding: 10px 6px 32px; }
        @media (min-width: 640px) { main { padding: 18px 20px 44px; } }

        .print-title { display: none; }

        .tt { display: grid; grid-template-columns: var(--pw) repeat(5, minmax(0, 1fr)); gap: var(--gap); }
        .contents { display: contents; }

        .dh { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 8px; border-radius: 8px; }
        .dc { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: 15px; font-weight: 800; }
        .dd { font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
        .dh.is-today { background: var(--today); }
        .dh.is-today .dc { background: var(--ink); color: var(--bg); }
        .dh.is-today .dd { color: var(--ink); font-weight: 700; }

        .pl { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-variant-numeric: tabular-nums; }
        .pn { font-size: 21px; font-weight: 900; line-height: 1; }
        .pn small { margin-left: 1px; font-size: 9px; font-weight: 700; color: var(--ink-2); }
        .pt { font-size: 9px; line-height: 1.3; color: var(--ink-3); text-align: center; }

        .cell { display: flex; min-width: 0; min-height: 96px; padding: 2px; border-radius: 8px; }
        .cell.is-today { background: var(--today); }
        .cell.empty { align-items: center; justify-content: center; }
        .cell.empty::after { content: ""; width: 10px; height: 2px; border-radius: 1px; background: var(--line); }

        .card {
            position: relative; flex: 1; min-width: 0;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 6px 6px 6px 7px;
            text-align: left; cursor: pointer;
            color: var(--ink); background: var(--t);
            border: 0; border-left: 3px solid var(--c); border-radius: 6px;
            transition: background .12s;
        }
        .card:hover { background: color-mix(in srgb, var(--t) 80%, var(--c) 14%); }
        .card.dim { opacity: .28; filter: grayscale(.6); }

        .sub {
            font-size: 10.5px; font-weight: 700; line-height: 1.35;
            display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
            overflow: hidden; overflow-wrap: anywhere;
        }
        .meta { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 6px; font-size: 9px; line-height: 1.2; color: var(--ink-2); }
        .tch { display: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .room {
            margin-left: auto; max-width: 100%; padding: 1px 5px;
            font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            background: var(--surface); border-radius: 4px;
        }

        /* 授業中のコマ: 塗りつぶして反転 */
        .card.is-now { background: var(--c); color: var(--on-solid); }
        .card.is-now .meta { color: inherit; opacity: .9; }
        .card.is-now .room { background: color-mix(in srgb, var(--on-solid) 20%, transparent); }

        @media (min-width: 640px) {
            .cell { min-height: 104px; padding: 3px; }
            .card { padding: 9px 10px 9px 11px; border-left-width: 4px; border-radius: 8px; }
            .sub { font-size: 14px; -webkit-line-clamp: 3; }
            .meta { font-size: 11px; margin-top: 8px; }
            .tch { display: block; }
            .dc { width: 32px; height: 32px; font-size: 16px; }
            .dd { font-size: 11px; }
            .pn { font-size: 28px; }
            .pn small { font-size: 11px; }
            .pt { font-size: 11px; }
        }

        /* ==================== モーダル ==================== */
        .overlay {
            position: fixed; inset: 0; z-index: 50;
            display: flex; align-items: flex-end; justify-content: center;
            background: rgba(10, 15, 25, .55);
            -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
        }
        .sheet {
            display: flex; flex-direction: column;
            width: 100%; max-width: 460px; max-height: 92dvh;
            overflow: hidden; background: var(--surface); color: var(--ink);
            border-radius: 18px 18px 0 0;
        }
        @media (min-width: 640px) {
            .overlay { align-items: center; padding: 16px; }
            .sheet { border-radius: 18px; max-height: 86dvh; }
            .sheet.wide { max-width: 520px; }
            .sheet.wide-xl { max-width: 780px; }
        }
        @media (prefers-reduced-motion: no-preference) {
            .overlay:not(.hidden) { animation: fade .18s ease-out; }
            .overlay:not(.hidden) .sheet { animation: rise .24s cubic-bezier(.2, .8, .2, 1); }
        }
        @keyframes fade { from { opacity: 0; } }
        @keyframes rise { from { transform: translateY(28px); opacity: 0; } }

        .sheet-head { position: relative; padding: 16px 52px 16px 18px; background: var(--c, var(--req)); color: var(--on-solid); }
        .sheet-head.plain { background: var(--ink); color: var(--bg); padding: 14px 52px 14px 18px; }
        .sheet-head h2 { font-size: 21px; font-weight: 900; line-height: 1.3; }
        .sheet-head.plain h2 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .pill { padding: 2px 10px; font-size: 11px; font-weight: 700; border-radius: 99px; background: color-mix(in srgb, var(--on-solid) 18%, transparent); }
        .x {
            position: absolute; top: 10px; right: 10px;
            width: 34px; height: 34px; display: grid; place-items: center;
            font-size: 16px; color: inherit; cursor: pointer;
            background: color-mix(in srgb, currentColor 16%, transparent);
            border: 0; border-radius: 50%;
        }

        .sheet-body { display: grid; gap: 20px; padding: 16px 18px; overflow-y: auto; overscroll-behavior: contain; }
        .sheet-foot {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
            background: var(--bg); border-top: 1px solid var(--line);
        }
        .sheet-foot small { font-size: 11px; color: var(--ink-3); }

        .info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
        .info-i { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .ico { width: 34px; height: 34px; display: grid; place-items: center; font-size: 17px; color: var(--ink-2); background: var(--oth-tint); border-radius: 99px; flex: none; }
        .info-k { font-size: 11px; color: var(--ink-3); }
        .info-v { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; line-height: 1.35; }

        .sec h3 { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
        .sec h3 .i { font-size: 15px; color: var(--ink-2); }

        .field {
            width: 100%; padding: 8px 10px;
            font: inherit; font-size: 16px; color: var(--ink);
            background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
        }
        @media (min-width: 640px) { .field { font-size: 13px; } }
        .field.sm { width: auto; padding: 5px 8px; font-size: 13px; background: var(--surface); }
        textarea.field { resize: vertical; min-height: 64px; line-height: 1.55; }

        .add-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        #modal-todo-input { flex: 1 1 140px; min-width: 0; }
        #modal-todo-date { width: auto; flex: 0 0 auto; }

        .btn {
            padding: 8px 14px; font-size: 13px; font-weight: 700; line-height: 1.2;
            color: var(--on-solid); background: var(--req);
            border: 0; border-radius: 8px; cursor: pointer;
        }
        .btn:hover { filter: brightness(1.08); }
        .btn.ink { background: var(--ink); color: var(--bg); }
        a.btn.syl { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        a.btn.hidden { display: none; }
        .btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
        .btn.warn { background: var(--warn); color: var(--bg); }

        .list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
        #modal-todo-list { max-height: 168px; overflow-y: auto; }
        .row {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 8px 10px; font-size: 13px;
            background: var(--bg); border-radius: 8px;
        }
        .row label { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; cursor: pointer; }
        .row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--req); flex: none; }
        .row .txt { overflow-wrap: anywhere; }
        .row .txt.done { text-decoration: line-through; color: var(--ink-3); }
        .row .end { display: flex; align-items: center; gap: 6px; flex: none; }
        .icon-btn { display: grid; place-items: center; width: 28px; height: 28px; font-size: 14px; color: var(--ink-3); background: transparent; border: 0; border-radius: 6px; cursor: pointer; }
        .icon-btn:hover { color: var(--danger); background: var(--danger-tint); }
        .empty-note { font-size: 12px; color: var(--ink-3); padding: 2px 0; }

        .bd { padding: 1px 6px; font-size: 10px; font-weight: 700; white-space: nowrap; border-radius: 5px; }
        .bd.over { color: var(--danger); background: var(--danger-tint); }
        .bd.today { color: var(--warn); background: var(--warn-tint); }
        .bd.soon { color: var(--req); background: var(--req-tint); }
        .bd.done { color: var(--ink-3); background: var(--ok-tint); }

        .group { padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
        .group-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
        .group-h strong { font-size: 14px; }
        .group-h span { font-size: 11px; color: var(--ink-3); }
        .group .list { margin-top: 8px; }
        .memo { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-top: 8px; padding: 8px 10px; font-size: 13px; color: var(--warn); background: var(--warn-tint); border-radius: 8px; }
        .memo .i { margin-right: 6px; vertical-align: -2px; }
        .memo-t { overflow-wrap: anywhere; white-space: pre-wrap; }
        .empty-big { padding: 28px 0; text-align: center; font-size: 13px; color: var(--ink-3); line-height: 1.8; }

        /* 年間予定モーダルスタイル */
        .calendar-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
        }
        .month-card {
            background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .month-title {
            font-size: 14px; font-weight: 800; color: var(--ink);
            padding-bottom: 4px; border-bottom: 2px solid var(--req);
            display: flex; align-items: center; justify-content: space-between;
        }
        .event-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12px; }
        .event-item { display: flex; gap: 6px; align-items: baseline; line-height: 1.35; }
        .event-date { font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; flex: none; width: 48px; font-size: 11px; }
        .event-desc { flex: 1; color: var(--ink); overflow-wrap: anywhere; }
        .event-tag { font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: 700; flex: none; }
        .tag-exam { background: var(--danger-tint); color: var(--danger); }
        .tag-event { background: var(--ele-tint); color: var(--ele); }
        .tag-holiday { background: var(--warn-tint); color: var(--warn); }
        .tag-off { background: var(--oth-tint); color: var(--oth); }

        /* ==================== 着せ替え ==================== */
        :root { --pc: color-mix(in srgb, var(--ink) 9%, transparent); }

        /* 背景の模様（--pc は模様の色。テーマごとに差し替わる） */
        :root[data-pattern="none"], .pv[data-p="none"] { --bg-image: none; --bg-size: auto; }
        :root[data-pattern="dots"], .pv[data-p="dots"] {
            --bg-image: radial-gradient(var(--pc) 1.5px, transparent 2px);
            --bg-size: 18px 18px;
        }
        :root[data-pattern="stripes"], .pv[data-p="stripes"] {
            --bg-image: repeating-linear-gradient(45deg, var(--pc) 0 2px, transparent 2px 14px);
            --bg-size: auto;
        }
        :root[data-pattern="grid"], .pv[data-p="grid"] {
            --bg-image: linear-gradient(var(--pc) 1px, transparent 1px), linear-gradient(90deg, var(--pc) 1px, transparent 1px);
            --bg-size: 24px 24px;
        }
        :root[data-pattern="ruled"], .pv[data-p="ruled"] {
            --bg-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--pc) 27px 28px);
            --bg-size: auto;
        }
        :root[data-pattern="checker"], .pv[data-p="checker"] {
            --bg-image: conic-gradient(var(--pc) 25%, transparent 0 50%, var(--pc) 0 75%, transparent 0);
            --bg-size: 32px 32px;
        }
        :root[data-pattern="waves"], .pv[data-p="waves"] {
            --bg-image: radial-gradient(circle 16px at 50% 100%, transparent 0 11px, var(--pc) 12px 14px, transparent 15px);
            --bg-size: 32px 16px;
        }
        :root[data-pattern="stars"], .pv[data-p="stars"] {
            --bg-image: var(--star-img, none);
            --bg-size: 120px 120px;
        }

        /* 着せ替えモーダル */
        .opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
        .opt-grid.sm { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }
        .opt {
            display: grid; gap: 6px; padding: 6px;
            font-size: 12px; font-weight: 700; text-align: center;

            root.dataset.pattern = 'none';
        });
        window.addEventListener('afterprint', apply);

        /* ---------- UI ---------- */
        function init() {
            const modal = document.getElementById('theme-modal');
            const themeGrid = document.getElementById('theme-grid');
            const patGrid = document.getElementById('pattern-grid');
            if (!modal) return;

            themeGrid.innerHTML = THEMES.map(t => {
                const pcv = t.pc || (t.id === 'default' ? 'transparent' : `color-mix(in srgb, ${t.ink} 9%, transparent)`);
                const style = t.id === 'default'
                    ? 'background:linear-gradient(135deg,#edf0f5 50%,#0e131b 50%)'
                    : `--pbg:${t.bg};--pc:${pcv}`;
                const dots = t.id === 'default'
                    ? '<i style="background:#2447a6"></i><i style="background:#0a7667"></i>'
                    : `<i style="background:${t.req}"></i><i style="background:${t.ele}"></i><i style="background:${t.surface}"></i>`;
                return `<button type="button" class="opt" data-theme-id="${t.id}" aria-pressed="false">
                    <span class="pv" data-p="${t.id === 'default' ? 'none' : (t.pat || 'none')}" style="${style}">${dots}</span>
                    <span>${t.name}</span></button>`;
            }).join('');

            themeGrid.querySelectorAll('.opt').forEach(b => {
                const t = THEMES.find(x => x.id === b.dataset.themeId);
                if (t && t.id !== 'default') b.querySelector('.pv').style.setProperty('--star-img', starImg(t.req));
            });

            patGrid.innerHTML = PATTERNS.map(([id, name]) => `
                <button type="button" class="opt" data-pattern-id="${id}" aria-pressed="false">
                    ${id === 'auto' ? '<span class="pv txt">自動</span>' : `<span class="pv" data-p="${id}"></span>`}
                    <span>${name}</span></button>`).join('');

            function refresh() {
                themeGrid.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeId === state.theme)));
                patGrid.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.patternId === state.pattern)));
            }
            function change(patch) { Object.assign(state, patch); save(); apply(); refresh(); }

            themeGrid.addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) change({ theme: b.dataset.themeId }); });
            patGrid.addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) change({ pattern: b.dataset.patternId }); });

            const open = () => { refresh(); modal.classList.remove('hidden'); };
            const close = () => modal.classList.add('hidden');
            document.getElementById('theme-btn').addEventListener('click', open);
            document.getElementById('theme-modal-close').addEventListener('click', close);
            document.getElementById('theme-modal-close-btn').addEventListener('click', close);
            document.getElementById('theme-reset').addEventListener('click', () => change({ theme: 'default', pattern: 'auto' }));
            modal.addEventListener('click', e => { if (e.target === modal) close(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.classList.contains('hidden')) close(); });
        }
        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>

        // 特定の日だけ時間割が違う日（日付 → 曜日 → コマ → 授業）
        const DATE_OVERRIDES = {

        };
        // 授業名から、その授業の担当・教室・区分を調べる（授業変更で使う）
        function subjectInfo(name) {
            return timetableData.find(d => d.subject === name && d.subject !== 'なし')
                || Object.values(DATE_OVERRIDES).map(o => Object.values(o).map(day => Object.values(day)).flat()).flat().find(x => x.subject === name)
                || null;

        function allSubjectNames() {
            const set = new Set(timetableData.filter(d => d.subject !== 'なし').map(d => d.subject));
            Object.values(DATE_OVERRIDES).forEach(o => Object.values(o).forEach(day => Object.values(day).forEach(x => { if (x.subject !== 'なし') set.add(x.subject); })));
            return [...set].sort((a, b) => a.localeCompare(b, 'ja'));
        }
        // 授業変更も反映した、その日その時限の授業（空きコマに授業を足す変更にも対応）
        function effectiveItem(dayCode, periodId, iso) {
            const base = scheduleItem(dayCode, periodId, iso);
            const sw = changesFor(iso, periodId).swap;
            if (!sw) return base;
            const info = subjectInfo(sw.subject) || {};
            return {
                day: dayCode, period: periodId, subject: sw.subject,
                teacher: info.teacher || '-', room: info.room || '-', category: info.category || 'OTHER',
                swapped: true, orig: (base && base.subject !== 'なし') ? base.subject : ''
            };
        }
        // その日（表示中の週の dayCode）に実際にある授業を返す
        function scheduleItem(dayCode, periodId, iso) {
            const base = timetableData.find(d => d.day === dayCode && d.period === periodId);
            const ov = iso && DATE_OVERRIDES[iso] && DATE_OVERRIDES[iso][dayCode] && DATE_OVERRIDES[iso][dayCode][periodId];
            return ov ? Object.assign({}, base || { day: dayCode, period: periodId }, ov) : base;

        // アプリケーション状態管理

        function loadStoredData(key) {
            try {

                return {};

        }

        function saveStoredData(key, data) {
            try {
                if (key === STORAGE_KEY_TODO) {
                    // 管理者が共有した課題は端末に保存せず、完了チェックだけ記録する
                    const local = {};
                    const done = Object.assign({}, sharedDone);
                    Object.keys(data).forEach(k => {
                        (data[k] || []).forEach(t => {
                            if (t.shared) { if (t.completed) done[t.docId] = 1; else delete done[t.docId]; }
                            else (local[k] = local[k] || []).push(t);
                        });

                    sharedDone = done;
                    localStorage.setItem(SHARED_DONE_KEY, JSON.stringify(done));
                    localStorage.setItem(key, JSON.stringify(local));
                    try { syncPersonalReminders(); } catch (e) { /* 無視 */ }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });

            const [y, m, d] = str.split('-').map(Number);

        function getDueDateBadge(dueDateStr, completed) {
            if (!dueDateStr) return '';
            if (completed) return `<span class="bd done">完了</span>`;

            const diffDays = Math.ceil((parseDate(dueDateStr) - startOfToday()) / (1000 * 60 * 60 * 24));

            if (diffDays < 0) return `<span class="bd over">${Math.abs(diffDays)}日超過</span>`;
            if (diffDays === 0) return `<span class="bd today">今日まで</span>`;
            return `<span class="bd soon">あと${diffDays}日</span>`;

        // 表示できる週：2026/10/5（月）の週 〜 2027/2/17 を含む週（その後は春休み）
        const WEEK_FIRST = '2026-10-05', WEEK_LAST_MONDAY = '2027-02-15';
        function baseMonday() {
            const now = getNow(), dow = now.getDay();
            const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            d.setDate(d.getDate() + (dow === 0 ? 1 : dow === 6 ? -5 : -(dow - 1)));
            return d;
        }
        function weekBounds() {
            const base = baseMonday();
            const wk = (iso) => Math.round((parseDate(iso) - base) / (7 * 86400000));
            return { min: wk(WEEK_FIRST), max: wk(WEEK_LAST_MONDAY) };
        }
        function changeWeek(delta, absolute) {
            const bd = weekBounds();
            const next = Math.max(bd.min, Math.min(bd.max, absolute ? 0 : weekOffset + delta));
            if (next === weekOffset) return;
            const dir = next > weekOffset ? 'slide-l' : 'slide-r';
            weekOffset = next;
            renderTimetable();
            const g = $('timetable-grid');
            g.classList.remove('slide-l', 'slide-r'); void g.offsetWidth; g.classList.add(dir);
            updateWeekNav();
        }
        function updateWeekNav() {
            const nav = $('week-nav');
            const bd = weekBounds();
            nav.classList.toggle('hidden', weekOffset === 0);
            $('week-prev').disabled = weekOffset <= bd.min;
            $('week-next').disabled = weekOffset >= bd.max;
            if (weekOffset === 0) return;
            const a = parseDate(displayDateISO('Mon')), b = parseDate(displayDateISO('Fri'));
            const rel = weekOffset > 0 ? `${weekOffset}週後` : `${-weekOffset}週前`;
            $('week-label').textContent = `${a.getMonth() + 1}/${a.getDate()} 〜 ${b.getMonth() + 1}/${b.getDate()}（${rel}）`;
        }
        function setupWeekSwipe() {
            const area = document.querySelector('main');
            let sx = 0, sy = 0, st = 0, tracking = false;
            area.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) { tracking = false; return; }
                sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); tracking = true;
            }, { passive: true });
            area.addEventListener('touchend', (e) => {
                if (!tracking) return;
                tracking = false;
                const t = e.changedTouches[0];
                const dx = t.clientX - sx, dy = t.clientY - sy;
                if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6 || Date.now() - st > 800) return;
                changeWeek(dx < 0 ? 1 : -1);
            }, { passive: true });
            $('week-prev').addEventListener('click', () => changeWeek(-1));
            $('week-next').addEventListener('click', () => changeWeek(1));
            $('week-today').addEventListener('click', () => changeWeek(0, true));
            document.addEventListener('keydown', (e) => {
                if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
                if (document.querySelector('.overlay:not(.hidden)')) return;
                if (e.key === 'ArrowLeft') changeWeek(-1);
                else if (e.key === 'ArrowRight') changeWeek(1);
            });
        }
        function updateCurrentTimeHighlight() {
            const now = getNow();

            const isHighlightEnabled = $('toggle-highlight').checked;
            const dayOfWeek = now.getDay();
            const dayCodes = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const isWeekday = dayOfWeek >= 1 && dayOfWeek <= 5;
            const currentDayCode = (isWeekday && weekOffset === 0) ? dayCodes[dayOfWeek] : null;

            // 曜日ヘッダーの日付 (日曜のみ翌週の日付を表示)
            const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const offset = dayOfWeek === 0 ? 1 : dayOfWeek === 6 ? -5 : -(dayOfWeek - 1);
            monday.setDate(monday.getDate() + offset + weekOffset * 7);
            DAYS.forEach((d, i) => {
                const dt = new Date(monday);
                dt.setDate(monday.getDate() + i);
                const dd = document.querySelector(`.dh[data-day-code="${d.code}"] .dd`);
                if (dd) dd.textContent = `${dt.getMonth() + 1}/${dt.getDate()}`;
            });

            // 今日の列
            document.querySelectorAll('.dh').forEach(el => {
                el.classList.toggle('is-today', isHighlightEnabled && el.dataset.dayCode === currentDayCode);
            });
            document.querySelectorAll('.cell').forEach(el => {
                el.classList.toggle('is-today', isHighlightEnabled && el.dataset.day === currentDayCode);
            });

            // 授業中のコマ
            document.querySelectorAll('.card.is-now').forEach(card => card.classList.remove('is-now'));

            const banner = $('current-subject-banner');

            if (!isHighlightEnabled || !isWeekday || weekOffset !== 0) {
                banner.classList.add('hidden');
                return;
            }

            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            let activePeriod = null;
            PERIODS.forEach(p => {
                const [sH, sM] = p.start.split(':').map(Number);
                const [eH, eM] = p.end.split(':').map(Number);
                if (currentMinutes >= (sH * 60 + sM) && currentMinutes <= (eH * 60 + eM)) {
                    activePeriod = p.id;
                }
            });

            if (!activePeriod) {
                banner.classList.add('hidden');
                return;
            }

            const activeCell = document.querySelector(`.cell[data-day="${currentDayCode}"][data-period="${activePeriod}"]`);
            const activeData = effectiveItem(currentDayCode, activePeriod, displayDateISO(currentDayCode));

            if (activeData && activeData.subject !== 'なし') {
                const card = activeCell && activeCell.querySelector('.card');
                if (card) card.classList.add('is-now');

                banner.classList.remove('hidden');
                const room = activeData.room && activeData.room !== '-' ? `<span class="muted">${escapeHtml(activeData.room)}</span>` : '';
                $('current-banner-text').innerHTML = `<strong>${activePeriod}限 ${escapeHtml(activeData.subject)}</strong>${room}`;
            } else {
                banner.classList.add('hidden');
            }
        }

                            ${del}
                        </li>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="month-title"><span>${escapeHtml(m.month)}</span></div>
                    <ul class="event-list">${eventsHtml}</ul>

        function fmtEventDate(d1, d2) {
            const w = '日月火水木金土';
            const a = parseDate(d1);
            const head = (a.getMonth() + 1) + '/' + a.getDate();
            if (!d2 || d2 <= d1) return head + '(' + w[a.getDay()] + ')';
            const b = parseDate(d2);
            if (a.getMonth() === b.getMonth()) return head + '-' + b.getDate();
            return head + '-' + (b.getMonth() + 1) + '/' + b.getDate();
        }
        async function postSharedEvent() {
            const d1 = $('ev-date').value, d2 = $('ev-date2').value;

            try {

                    month: (parseDate(d1).getMonth() + 1) + '月', date: fmtEventDate(d1, d2),
                    sortDate: d1, desc: desc, type: type,

        async function deleteSharedEvent(docId) {

        function isoOf(d) {
            const z = n => String(n).padStart(2, '0');

        }
        // 時間割表に表示している週の、各曜日の日付（土日は翌週）
        let weekOffset = 0;  // 0=今週（土日は来週）、+1=次の週、-1=前の週
        function displayDateISO(dayCode) {
            const now = getNow();
            const dow = now.getDay();
            const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            d.setDate(d.getDate() + (dow === 0 ? 1 : dow === 6 ? -5 : -(dow - 1)) + weekOffset * 7 + DAYS.findIndex(x => x.code === dayCode));
            return isoOf(d);
        }
        function changesFor(dateISO, periodId) {

        // 終わった週の記録から、自分の順位・連覇・称号を計算する
        function analyzeScores(docs, me) {
            const WEEKS = 8;
            const by = {};  // 'week|level' -> device -> {t, ts}
            docs.forEach(d => {
                const v = d.data();
                const lv = Number(v.level), t = Number(v.time);
                if (!(lv >= 0 && lv <= 2) || !(t > 0) || !v.device) return;
                const ts = v.createdAt && v.createdAt.toMillis ? v.createdAt.toMillis() : 0;
                const key = v.week + '|' + lv;
                const m = by[key] || (by[key] = {});
                const cur = m[v.device];
                if (!cur || t < cur.t || (t === cur.t && ts && ts < cur.ts)) m[v.device] = { t: t, ts: ts };
            });
            const rankOf = (week, lv) => {
                const m = by[week + '|' + lv];
                if (!m || !m[me]) return 0;
                const order = Object.keys(m).sort((a, b) => m[a].t - m[b].t || (m[a].ts || 0) - (m[b].ts || 0));
                return order.indexOf(me) + 1;
            };
            const weeks = [];  // 古い週 → 新しい週
            for (let k = WEEKS; k >= 1; k--) weeks.push(msWeekKey(-k));
            const r = { champ: [], titles: [] };
            let first = false, second = false, podium = false, triple = false, bestRun = 0;
            weeks.forEach(w => {
                const ranks = [0, 1, 2].map(lv => rankOf(w, lv));
                ranks.forEach(x => { if (x === 1) first = true; if (x === 2) second = true; if (x >= 1 && x <= 3) podium = true; });
                if (ranks.every(x => x === 1)) triple = true;
            });
            [0, 1, 2].forEach(lv => {
                let run = 0;
                weeks.forEach(w => { if (rankOf(w, lv) === 1) { run++; bestRun = Math.max(bestRun, run); } else run = 0; });
                let streak = 0;   // 先週から数えた現在の連覇
                for (let k = 1; k <= WEEKS; k++) { if (rankOf(msWeekKey(-k), lv) === 1) streak++; else break; }
                if (streak >= 1) r.champ.push({ level: lv, streak: streak });
            });
            if (first) r.titles.push('first');
            if (second) r.titles.push('second');
            if (podium) r.titles.push('podium');
            if (bestRun >= 3) r.titles.push('streak3');
            if (bestRun >= 5) r.titles.push('streak5');
            if (triple) r.titles.push('triple');
            return r;
        }
        async function checkChampion(tries) {
            tries = tries || 0;
            if (!noticeDb) { if (tries < 8) setTimeout(() => checkChampion(tries + 1), 1500); return; }
            let me = '';
            try { me = localStorage.getItem(MS_DEV_KEY) || ''; } catch (e) { me = ''; }
            if (!me) return;
            const thisWeek = msWeekKey(0);
            try {
                const weeks = [1, 2, 3, 4, 5, 6, 7, 8].map(k => msWeekKey(-k));
                const snap = await noticeDb.collection('scores').where('week', 'in', weeks).limit(2000).get();
                const res = analyzeScores(snap.docs, me);
                champInfo = { week: thisWeek, levels: res.champ };
                try { localStorage.setItem(MS_CHAMP_KEY, JSON.stringify(champInfo)); } catch (e) { /* 無視 */ }
                applyChampionStyle();
                // 新しい称号
                const got = loadTitles();
                const fresh = res.titles.filter(id => !got[id]);
                fresh.forEach(id => { got[id] = { at: todayStr() }; });
                if (fresh.length) {
                    try { localStorage.setItem(MS_TITLES_KEY, JSON.stringify(got)); } catch (e) { /* 無視 */ }
                    pendingTitles = pendingTitles.concat(MS_TITLES.filter(t => fresh.includes(t.id)));
                }
                let shown = '';
                try { shown = localStorage.getItem(MS_CHAMP_SHOWN) || ''; } catch (e) { shown = ''; }
                if (res.champ.length && shown !== thisWeek) showChampionCelebration();
                flushTitles();
            } catch (e) { console.warn('champion', e); }
        }

        function msDevice() {

                    d = Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b => b.toString(16).padStart(2, '0')).join('');

        function collectDueTodos() {
            const today = startOfToday();
            const r = { overdue: 0, today: 0, tomorrow: 0 };
            Object.keys(subjectTodos).forEach(k => {
                (subjectTodos[k] || []).forEach(t => {
                    if (t.completed || !t.dueDate) return;
                    const diff = Math.round((parseDate(t.dueDate) - today) / 86400000);
                    if (diff < 0) r.overdue++;
                    else if (diff === 0) r.today++;
                    else if (diff === 1) r.tomorrow++;
                });
            });
            return r;
        }
        function dueSummaryText(r) {
            const parts = [];
            if (r.overdue) parts.push('期限切れ ' + r.overdue + '件');
            if (r.today) parts.push('今日 ' + r.today + '件');
            if (r.tomorrow) parts.push('明日 ' + r.tomorrow + '件');
            return parts.join(' / ');
        }
        async function checkDueReminders() {
            const r = collectDueTodos();
            const total = r.overdue + r.today + r.tomorrow;
            const banner = $('due-banner');
            if (!total) { banner.classList.add('hidden'); return; }
            const text = dueSummaryText(r);
            $('due-banner-text').textContent = '⏰ 期限が近い課題があります：' + text;
            if (!banner.dataset.closed) banner.classList.remove('hidden');
            // 通知（1日1回）
            try {
                if (!('Notification' in window) || Notification.permission !== 'granted') return;
                const key = todayStr() + ':' + total;
                if (localStorage.getItem(DUE_NOTIFIED_KEY) === key) return;
                localStorage.setItem(DUE_NOTIFIED_KEY, key);
                const reg = await navigator.serviceWorker.ready;
                await reg.showNotification('課題の期限が近づいています', {
                    body: text,
                    icon: 'icons/icon-192.png',
                    tag: 'due-reminder',
                    data: { url: './' }
                });
            } catch (e) { /* 無視 */ }
        }

        function onNoticeBodyClick(e) {
            const t = e.target.closest('[data-act]');
            if (!t) return;
            const act = t.dataset.act;
            if (act === 'post') postNotice();
            else if (act === 'cancel-edit') stopNoticeEdit();
            else if (act === 'edit') startNoticeEdit(t.dataset.id);
            else if (act === 'del') deleteNotice(t.dataset.id);
            else if (act === 'login') loginNotice();
            else if (act === 'back') { noticeView = 'list'; renderNoticeFrame(); }
            else if (act === 'push-on') enablePush();
            else if (act === 'push-off') disablePush();
        }
        function onNoticeAdminBtn() {
            if (isAdmin && noticeAuth) noticeAuth.signOut();
        }

        /* 管理者ログイン画面を出す「合図」
           ・お知らせ画面のタイトル「お知らせ」を、3秒以内に10回タップ
           ・お知らせ画面を開いた状態で、キーボードから admin と入力（パソコン用） */
        const SECRET_TAPS = 10;
        const SECRET_TAP_MS = 3000;
        const SECRET_WORD = 'admin';
        let secretTapTimes = [];
        let secretTyped = '';

        function openAdminLogin() {
            if (isAdmin || !isNoticeOpen()) return;
            noticeView = 'login';
            renderNoticeFrame();
            const el = $('nt-email');
            if (el) el.focus();
        }
        function onNoticeTitleTap() {
            const now = Date.now();
            secretTapTimes = secretTapTimes.filter(t => now - t < SECRET_TAP_MS);
            secretTapTimes.push(now);
            if (secretTapTimes.length >= SECRET_TAPS) {
                secretTapTimes = [];
                openAdminLogin();
            }
        }
        function onSecretKey(e) {
            if (!isNoticeOpen()) { secretTyped = ''; return; }
            const tag = (e.target && e.target.tagName) || '';
            if (tag === 'INPUT' || tag === 'TEXTAREA') { secretTyped = ''; return; }
            if (e.key.length !== 1) return;
            secretTyped = (secretTyped + e.key.toLowerCase()).slice(-SECRET_WORD.length);
            if (secretTyped === SECRET_WORD) {
                secretTyped = '';
                openAdminLogin();
            }
        }

        function openNoticeModal() {
            noticeSeenAtOpen = getNoticeSeen();
            noticeView = 'list';
            renderNoticeFrame();
            $('notice-modal').classList.remove('hidden');
            setNoticeSeen(Math.max(noticeSeenAtOpen, latestNoticeId()));
            updateNoticeBadge();
        }
        function closeNoticeModal() {
            $('notice-modal').classList.add('hidden');
        }

        // ==================== 科目詳細モーダル制御 ====================
        // シラバスへのリンク（科目名 → subject_id）
        const SYLLABUS_BASE = 'https://syllabus.kosen-k.go.jp/Pages/PublicSyllabus?school_id=07&department_id=20&year=2023&lang=ja&subject_id=';
        const SYLLABUS_IDS = {
            '国語Ⅳ': '0092',
            '総合英語Ⅱ': '0094',
            '法学憲法': '0096',
            '人文科学': '0097',
            'フランス語': '0098',
            '化学特論': '0120',
            '第Ⅰ類実験Ⅱ': '0069',
            '電子回路': '0074',
            '電気電子計測': '0077',
            '高周波回路': '0079',
            '電磁波工学Ⅰ': '0080',
            'IoT・エッジコンピューティング': '0090',
            'マルチメディア情報': '0102',
            'ネットワークプログラミング': '0110',
            'ネットワーク技術': '0108',
            'コンピュータシステム応用': '0112',
            'ICTシステム開発演習': '0116',
            '応用数学B': '0118',
            '情報セキュリティ': '0111'
        };
        const SYLLABUS_BY_NAME = {};
        Object.keys(SYLLABUS_IDS).forEach(k => { SYLLABUS_BY_NAME[k.normalize('NFKC')] = SYLLABUS_IDS[k]; });
        function syllabusUrl(subject) {
            const id = SYLLABUS_BY_NAME[String(subject).normalize('NFKC')];
            return id ? SYLLABUS_BASE + id : '';
        }

        function openSubjectModal(dayCode, periodId) {
            const item = effectiveItem(dayCode, periodId, displayDateISO(dayCode));
            if (!item || item.subject === 'なし') return;

            activeSelectedSubject = { day: dayCode, period: periodId, ...item };
            const subjectKey = `${dayCode}_${periodId}`;
            const catInfo = CATEGORIES[item.category] || CATEGORIES.OTHER;

            $('modal-title').textContent = item.subject;
            $('modal-teacher').textContent = item.teacher && item.teacher !== '-' ? item.teacher : '未設定';
            $('modal-room').textContent = item.room && item.room !== '-' ? item.room : '未設定';
            const syl = syllabusUrl(item.subject), sylEl = $('modal-syllabus');
            if (syl) { sylEl.href = syl; sylEl.classList.remove('hidden'); } else { sylEl.removeAttribute('href'); sylEl.classList.add('hidden'); }

            const dayObj = DAYS.find(d => d.code === dayCode);
            const periodObj = PERIODS.find(p => p.id === periodId);
            $('modal-period-badge').textContent = `${dayObj.name} ${periodObj.name} ${periodObj.start}–${periodObj.end}`;

            $('modal-header-bg').className = `sheet-head cat-${item.category}`;
            $('modal-category-badge').textContent = catInfo.name;
            $('modal-memo').value = subjectMemos[subjectKey] || '';
            $('modal-todo-input').value = '';$('modal-todo-date').value = '';
            renderModalTodoList(subjectKey);

            $('subject-modal').classList.remove('hidden');
        }

        // 閉じるときにメモを自動保存
        function closeSubjectModal() {
            if (activeSelectedSubject && !$('subject-modal').classList.contains('hidden')) {
                const subjectKey = `${activeSelectedSubject.day}_${activeSelectedSubject.period}`;
                const value = $('modal-memo').value;
                if (value.trim()) {
                    subjectMemos[subjectKey] = value;
                } else {
                    delete subjectMemos[subjectKey];
                }
                saveStoredData(STORAGE_KEY_MEMO, subjectMemos);
            }
            $('subject-modal').classList.add('hidden');
        }

        // 課題の並び順: 未完了が先 → 期限が近い(過ぎたものを含む)順 → 期限なしは最後
        function compareTodos(a, b) {
            if (a.completed !== b.completed) return a.completed ? 1 : -1;
            if (!a.dueDate && !b.dueDate) return a.origIdx - b.origIdx;
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate) || a.origIdx - b.origIdx;
        }
        // 科目グループの並び順: 一番近い未完了の期限が早い科目を上に
        function subjectGroupRank(item) {
            const todos = subjectTodos[`${item.day}_${item.period}`] || [];
            const open = todos.filter(t => !t.completed);
            const dates = open.filter(t => t.dueDate).map(t => t.dueDate).sort();
            if (dates.length) return [0, dates[0]];
            if (open.length) return [1, ''];
            return [2, ''];
        }
        function compareSubjectGroups(a, b) {
            const ra = subjectGroupRank(a), rb = subjectGroupRank(b);
            return (ra[0] - rb[0]) || ra[1].localeCompare(rb[1]);
        }

        function renderModalTodoList(subjectKey) {
            const listEl = $('modal-todo-list');
            listEl.innerHTML = '';

            const todos = subjectTodos[subjectKey] || [];

            if (todos.length === 0) {
                listEl.innerHTML = `<li class="empty-note">課題はありません。上の欄から追加できます。</li>`;
                return;
            }

            todos.map((t, origIdx) => ({ ...t, origIdx })).sort(compareTodos).forEach(todo => {
                const index = todo.origIdx;
                const li = document.createElement('li');
                li.className = 'row';
                li.innerHTML = `
                    <label>
                        <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodoState('${subjectKey}', ${index})">
                        <span class="txt${todo.completed ? ' done' : ''}">${escapeHtml(todo.text)}${todo.shared ? '<span class="shared-tag">共通</span>' : ''}</span>
                    </label>
                    <div class="end">
                        ${getDueDateBadge(todo.dueDate, todo.completed)}
                        ${(todo.shared && !isAdmin) ? '' : `<button type="button" class="icon-btn" aria-label="課題を削除" onclick="deleteTodo('${subjectKey}', ${index})">${icon('trash')}</button>`}
                    </div>
                `;
                listEl.appendChild(li);
            });
        }

        function toggleTodoState(subjectKey, index) {
            if (subjectTodos[subjectKey] && subjectTodos[subjectKey][index]) {
                subjectTodos[subjectKey][index].completed = !subjectTodos[subjectKey][index].completed;
                saveStoredData(STORAGE_KEY_TODO, subjectTodos);
                renderModalTodoList(subjectKey);
                renderTimetable();
            }
        }

        function toggleTodoStateFromSummary(subjectKey, index) {
            if (subjectTodos[subjectKey] && subjectTodos[subjectKey][index]) {
                subjectTodos[subjectKey][index].completed = !subjectTodos[subjectKey][index].completed;
                saveStoredData(STORAGE_KEY_TODO, subjectTodos);
                openTodoSummaryModal();
                renderTimetable();
            }
        }

        function deleteTodo(subjectKey, index) {
            const target = subjectTodos[subjectKey] && subjectTodos[subjectKey][index];
            if (target && target.shared) { deleteSharedTodo(target.docId); return; }
            if (subjectTodos[subjectKey]) {
                subjectTodos[subjectKey].splice(index, 1);
                saveStoredData(STORAGE_KEY_TODO, subjectTodos);
                renderModalTodoList(subjectKey);
                renderTimetable();
            }
        }

        function deleteTodoFromSummary(subjectKey, index) {
            const target = subjectTodos[subjectKey] && subjectTodos[subjectKey][index];
            if (target && target.shared) { deleteSharedTodo(target.docId); return; }
            if (subjectTodos[subjectKey]) {
                subjectTodos[subjectKey].splice(index, 1);
                saveStoredData(STORAGE_KEY_TODO, subjectTodos);
                openTodoSummaryModal();
                renderTimetable();
            }
        }

        function deleteMemoFromSummary(subjectKey) {
            if (subjectMemos[subjectKey]) {
                delete subjectMemos[subjectKey];
                saveStoredData(STORAGE_KEY_MEMO, subjectMemos);
                openTodoSummaryModal();
                renderTimetable();
            }
        }

        function addTodoItem() {
            if (!activeSelectedSubject) return;
            const input = $('modal-todo-input');
            const dateInput = $('modal-todo-date');
            const text = input.value.trim();
            const dueDate = dateInput.value;
            if (!text) return;

            const sharedBox = $('modal-todo-shared');
            if (isAdmin && sharedBox && sharedBox.checked) {
                postSharedTodo(`${activeSelectedSubject.day}_${activeSelectedSubject.period}`, text, dueDate, activeSelectedSubject.subject);
                input.value = '';
                dateInput.value = '';
                return;
            }

            const subjectKey = `${activeSelectedSubject.day}_${activeSelectedSubject.period}`;
            if (!subjectTodos[subjectKey]) {
                subjectTodos[subjectKey] = [];
            }

            subjectTodos[subjectKey].push({
                text: text,
                dueDate: dueDate || '',
                completed: false,
                createdAt: new Date().toISOString()
            });
            saveStoredData(STORAGE_KEY_TODO, subjectTodos);
            input.value = '';
            dateInput.value = '';
            renderModalTodoList(subjectKey);
            renderTimetable();
        }

        function updateTodoBadgeCount() {
            let totalUncompleted = 0;
            Object.values(subjectTodos).forEach(list => {
                totalUncompleted += list.filter(t => !t.completed).length;
            });

            const badge = $('todo-badge');
            if (totalUncompleted > 0) {
                badge.textContent = totalUncompleted;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function openTodoSummaryModal() {
            const body = $('todo-summary-body');
            body.innerHTML = '';

            let hasItems = false;

            [...timetableData].sort(compareSubjectGroups).forEach(item => {
                if (item.subject === 'なし') return;
                const subjectKey = `${item.day}_${item.period}`;
                const todos = subjectTodos[subjectKey] || [];
                const memo = subjectMemos[subjectKey] || '';

                if (todos.length === 0 && !memo.trim()) return;
                hasItems = true;

                const dayObj = DAYS.find(d => d.code === item.day);
                const sortedTodos = todos.map((t, origIdx) => ({ ...t, origIdx }));
                sortedTodos.sort(compareTodos);

                const todosHtml = sortedTodos.length ? `
                    <ul class="list">
                        ${sortedTodos.map(t => `
                            <li class="row">
                                <label>
                                    <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodoStateFromSummary('${subjectKey}',${t.origIdx})">
                                    <span class="txt${t.completed ? ' done' : ''}">${escapeHtml(t.text)}${t.shared ? '<span class="shared-tag">共通</span>' : ''}</span>
                                </label>
                                <div class="end">
                                    ${getDueDateBadge(t.dueDate, t.completed)}
                                    ${(t.shared && !isAdmin) ? '' : `<button type="button" class="icon-btn" aria-label="課題を削除" onclick="deleteTodoFromSummary('${subjectKey}',${t.origIdx})">${icon('trash')}</button>`}
                                </div>
                            </li>
                        `).join('')}
                    </ul>` : '';

                const memoHtml = memo.trim() ? `
                    <div class="memo">
                        <div class="memo-t">${icon('note')}${escapeHtml(memo)}</div>
                        <button type="button" class="icon-btn" aria-label="メモを削除" onclick="deleteMemoFromSummary('${subjectKey}')">${icon('trash')}</button>
                    </div>` : '';

                const section = document.createElement('div');
                section.className = `group cat-${item.category}`;
                section.innerHTML = `
                    <div class="group-h">
                        <strong>${escapeHtml(item.subject)}</strong>
                        <span>${dayObj.name} ${item.period}限</span>
                    </div>
                    ${todosHtml}
                    ${memoHtml}
                `;
                body.appendChild(section);
            });

            if (!hasItems) {
                body.innerHTML = `<div class="empty-big">課題やメモはまだありません。<br>時間割の科目をタップすると追加できます。</div>`;
            }

            $('todo-summary-modal').classList.remove('hidden');
        }

        function closeTodoSummaryModal() {
            $('todo-summary-modal').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTimetable();
            setInterval(updateCurrentTimeHighlight, 1000);

            // 区分フィルター
            document.querySelectorAll('#category-filter button').forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryFilter = btn.dataset.value;
                    document.querySelectorAll('#category-filter button').forEach(b => {
                        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
                    });
                    renderTimetable();
                });
            });
            $('toggle-highlight').addEventListener('change', updateCurrentTimeHighlight);

            // 年間予定モーダルイベント
            $('calendar-btn').addEventListener('click', openCalendarModal);$('calendar-modal-close').addEventListener('click', closeCalendarModal);
            $('calendar-modal-close-btn').addEventListener('click', closeCalendarModal);$('calendar-modal').addEventListener('click', (e) => {
                if (e.target.id === 'calendar-modal') closeCalendarModal();
            });

            // お知らせイベント
            updateNoticeBadge();
            initNoticeBackend();
            refreshPushTokenIfNeeded(); setTimeout(syncPersonalReminders, 6000);
            $('due-banner-open').addEventListener('click', openTodoSummaryModal);
            $('due-banner-close').addEventListener('click', () => {
                $('due-banner').dataset.closed = '1';
                $('due-banner').classList.add('hidden');
            });
            checkDueReminders();
            document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDueReminders(); });
            setInterval(checkDueReminders, 30 * 60 * 1000);
            $('notice-modal-body').addEventListener('click', onNoticeBodyClick);
            $('notice-admin-btn').addEventListener('click', onNoticeAdminBtn);
            $('notice-push-btn').addEventListener('click', onPushBtnClick);
            $('calendar-modal-body').addEventListener('click', onCalendarBodyClick);
            $('notice-modal-body').addEventListener('click', onChangesClick);
            setupWeekSwipe();
            initChampion();
            $('game-rank-btn').addEventListener('click', () => { if (isRankOpen()) hideRanking(); else { rankState = { offset: 0, level: rankState.level, note: '' }; showRanking(); } });
            $('rank-panel').addEventListener('click', onRankClick);
            $('game-title-btn').addEventListener('click', () => { if (isTitleOpen()) hideTitles(); else showTitles(); });
            window.addEventListener('message', (e) => {
                const f = document.getElementById('game-frame');
                if (!f || e.source !== f.contentWindow) return;
                const d = e.data;
                if (d && d.type === 'ms-win') handleMsWin(Number(d.level), Number(d.time));
            });
            $('notice-modal-title').addEventListener('click', onNoticeTitleTap);
            document.addEventListener('keydown', onSecretKey);
            $('notice-btn').addEventListener('click', openNoticeModal);
            $('notice-modal-close').addEventListener('click', closeNoticeModal);
            $('notice-modal-close-btn').addEventListener('click', closeNoticeModal);
            $('notice-modal').addEventListener('click', (e) => {
                if (e.target.id === 'notice-modal') closeNoticeModal();
            });

            // 科目モーダルイベント
            $('modal-close-btn').addEventListener('click', () => { closeSubjectModal(); renderTimetable(); });
            $('modal-save-btn').addEventListener('click', () => { closeSubjectModal(); renderTimetable(); });$('subject-modal').addEventListener('click', (e) => {
                if (e.target.id === 'subject-modal') { closeSubjectModal(); renderTimetable(); }
            });

            $('modal-todo-add-btn').addEventListener('click', addTodoItem);$('modal-todo-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTodoItem();
            });

            // 課題・メモ一覧イベント
            $('todo-list-btn').addEventListener('click', openTodoSummaryModal);$('todo-modal-close').addEventListener('click', closeTodoSummaryModal);
            $('todo-modal-close-btn').addEventListener('click', closeTodoSummaryModal);$('todo-summary-modal').addEventListener('click', (e) => {
                if (e.target.id === 'todo-summary-modal') closeTodoSummaryModal();
            });

            // Esc キーで閉じる
            document.addEventListener('keydown', (e) => {
                if (e.key !== 'Escape') return;
                if (!$('calendar-modal').classList.contains('hidden')) closeCalendarModal();
                if (!$('notice-modal').classList.contains('hidden')) closeNoticeModal();
                if (!$('subject-modal').classList.contains('hidden')) { closeSubjectModal(); renderTimetable(); }
                if (!$('todo-summary-modal').classList.contains('hidden')) closeTodoSummaryModal();
            });
        });
    </script>

<script>
const LV=[{c:9,r:9,m:10},{c:12,r:16,m:30},{c:16,r:24,m:62}];
const $=id=>document.getElementById(id);
const boardEl=$('board');
let L,cells,started,over,flags,opened,timer,t0,flagMode=false;
const bestKey=i=>'ms-best-'+i;
function getBest(i){try{return localStorage.getItem(bestKey(i))}catch(e){return null}}
function setBest(i,v){try{localStorage.setItem(bestKey(i),v)}catch(e){}}
function init(){
  L=LV[+$('level').value];
  cells=Array.from({length:L.r*L.c},()=>({m:false,o:false,f:false,n:0}));
  started=false;over=false;flags=0;opened=0;clearInterval(timer);
  $('time').textContent=0;$('mines').textContent=L.m;
  const b=getBest($('level').value);$('best').textContent=b?b+'秒':'-';
  $('msg').textContent='最初のマスをタップして開始';
  boardEl.style.gridTemplateColumns=`repeat(${L.c},1fr)`;
  boardEl.innerHTML='';
  cells.forEach((_,i)=>{
    const d=document.createElement('div');d.className='c';d.dataset.i=i;d.tabIndex=i===0?0:-1;d.setAttribute('role','gridcell');
    boardEl.appendChild(d);
  });
}
const nb=i=>{const x=i%L.c,y=(i/L.c)|0,a=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;
    const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<L.c&&ny<L.r)a.push(ny*L.c+nx)}return a};
function place(safe){
  const ban=new Set([safe,...nb(safe)]);
  const pool=cells.map((_,i)=>i).filter(i=>!ban.has(i));
  for(let k=pool.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;[pool[k],pool[j]]=[pool[j],pool[k]]}
  pool.slice(0,L.m).forEach(i=>cells[i].m=true);
  cells.forEach((c,i)=>c.n=nb(i).filter(j=>cells[j].m).length);
}
function draw(i){
  const c=cells[i],e=boardEl.children[i];
  e.className='c';e.textContent='';
  if(c.o){e.classList.add('o');if(c.m){e.classList.add('m');e.textContent='💣'}else if(c.n){e.textContent=c.n;e.classList.add('n'+c.n)}}
  else if(c.f)e.textContent='🚩';
}
function reveal(i){
  const st=[i];
  while(st.length){
    const k=st.pop(),c=cells[k];
    if(c.o||c.f)continue;
    c.o=true;opened++;draw(k);
    if(c.m)return lose(k);
    if(c.n===0)nb(k).forEach(j=>{if(!cells[j].o)st.push(j)});
  }
}
function open(i){
  if(over)return;
  const c=cells[i];
  if(c.f)return;
  if(!started){started=true;place(i);t0=Date.now();timer=setInterval(()=>$('time').textContent=Math.floor((Date.now()-t0)/1000),250);$('msg').textContent='がんばって！'}
  if(c.o){ // chord
    if(!c.n)return;
    const ns=nb(i);
    if(ns.filter(j=>cells[j].f).length!==c.n)return;
    ns.forEach(j=>{if(!over&&!cells[j].o&&!cells[j].f)reveal(j)});
  }else reveal(i);
  if(!over)checkWin();
}
function flag(i){
  if(over||!started)return;
  const c=cells[i];if(c.o)return;
  c.f=!c.f;flags+=c.f?1:-1;$('mines').textContent=L.m-flags;draw(i);
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
}
function lose(k){
  over=true;clearInterval(timer);
  cells.forEach((c,i)=>{if(c.m&&!c.f){c.o=true;draw(i)}else if(!c.m&&c.f){boardEl.children[i].className='c w';boardEl.children[i].textContent='✖'}});
  boardEl.children[k].classList.add('w');
  $('msg').textContent='💥 地雷を踏みました。「もう一度」で再挑戦';
}
function checkWin(){
  if(opened!==cells.length-L.m)return;
  over=true;clearInterval(timer);
  const s=Math.floor((Date.now()-t0)/1000);$('time').textContent=s;
  cells.forEach((c,i)=>{if(c.m&&!c.f){c.f=true;draw(i)}});$('mines').textContent=0;
  const lv=$('level').value,b=+getBest(lv);
  let t='🎉 クリア！ '+s+'秒';
  if(!b||s<b){setBest(lv,s);$('best').textContent=s+'秒';t+='（ベスト更新）'}
  $('msg').textContent=t;
  try{parent.postMessage({type:'ms-win',level:+lv,time:s},'*')}catch(e){}
}
// input
let pt=null,lp=false;
boardEl.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.c');if(!t||e.button===2)return;
  lp=false;const i=+t.dataset.i;
  pt=setTimeout(()=>{lp=true;flag(i)},420);
});
const cancel=()=>{clearTimeout(pt)};
boardEl.addEventListener('pointerup',e=>{
  cancel();const t=e.target.closest('.c');if(!t||e.button===2)return;
  if(lp){lp=false;return}
  const i=+t.dataset.i;
  if(flagMode&&!cells[i].o)flag(i);else open(i);
});
boardEl.addEventListener('pointerleave',cancel);
boardEl.addEventListener('pointercancel',cancel);
boardEl.addEventListener('contextmenu',e=>{e.preventDefault();const t=e.target.closest('.c');if(t)flag(+t.dataset.i)});
boardEl.addEventListener('keydown',e=>{
  const t=e.target.closest('.c');if(!t)return;const i=+t.dataset.i;
  const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-L.c,ArrowDown:L.c}[e.key];
  if(mv!==undefined){e.preventDefault();const j=i+mv;if(j>=0&&j<cells.length&&Math.abs((j%L.c)-(i%L.c))<=1){t.tabIndex=-1;boardEl.children[j].tabIndex=0;boardEl.children[j].focus()}}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();open(i)}
  else if(e.key==='f'||e.key==='F')flag(i);
});
$('mode').onclick=()=>{flagMode=!flagMode;$('mode').setAttribute('aria-pressed',flagMode)};
$('reset').onclick=init;
$('level').onchange=init;
init();
<\/script>

<script>
/* 隠しコマンド: 「現在コマ強調」を10回切り替えるとマインスイーパーが開く */
(function () {
    const toggle = document.getElementById('toggle-highlight');
    const modal = document.getElementById('game-modal');
    const body = document.getElementById('game-body');
    if (!toggle || !modal) return;
    const NEED = 10, GAP_MS = 5000;
    let count = 0, last = 0;

    function openGame() {
        if (!body.firstChild) {
            const f = document.createElement('iframe');
            f.id = 'game-frame';
            f.title = 'マインスイーパー';
            let gsrc = document.getElementById('game-src').textContent.replace(/<\\\/script>/g, '<' + '/script>');
            try {
                if (champActiveToday()) {
                    gsrc = gsrc.split("e.textContent='🚩'").join("e.textContent='👑'")
                        .replace('🚩 旗モード', '👑 旗モード')
                        .replace('<h1>マインスイーパー</h1>', '<h1>マインスイーパー</h1><div style="font-size:13px;font-weight:800;color:#a06c00;margin:-4px 0 0">👑 ' + champSummary() + '</div>');
                }
            } catch (e) { /* 無視 */ }
            f.srcdoc = gsrc;
            body.appendChild(f);
        }
        modal.classList.remove('hidden');
    }
    function closeGame() {
        modal.classList.add('hidden');
        body.innerHTML = ''; // 閉じたらゲームを破棄（タイマーも止まる）
        try { hideRanking(); hideTitles(); } catch (e) { /* 無視 */ }
    }

    toggle.addEventListener('change', () => {
        const now = Date.now();
        count = (now - last > GAP_MS) ? 1 : count + 1;
        last = now;
        if (count >= NEED) { count = 0; openGame(); }
    });
    document.getElementById('game-modal-close').addEventListener('click', closeGame);
    modal.addEventListener('click', e => { if (e.target === modal) closeGame(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeGame(); });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
    });
}
